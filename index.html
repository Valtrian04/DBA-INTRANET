<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="GENERATOR" content="Microsoft FrontPage 4.0">
    <title>D.B.A - Terminal de Acceso Seguro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/face-min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="font-ui">

    <!-- PANTALLA DE ACCESO INICIAL -->
    <div id="login-screen">
        <div class="noise-overlay"></div>
        <div class="scanlines-overlay"></div>
        <div class="font-sys font-bold text-2xl mb-4 text-[#00ff00] tracking-widest"
             style="text-shadow: 0 0 5px #00ff00;">
            D.B.A. TERMINAL DE ACCESO SEGURO
        </div>

        <div id="scanner-container">
            <video id="cam-feed" width="320" height="240" autoplay muted playsinline></video>
            <div id="face-box"></div>
            <div id="flash-effect"></div>
            <div id="scan-line"></div>
            <div class="noise-overlay"></div>
            <div class="scanlines-overlay"></div>
        </div>

        <div id="terminal-output" class="font-sys">
            <span>> INICIALIZANDO PROTOCOLOS DE SEGURIDAD...</span>
            <span>> ESPERANDO SEÑAL ÓPTICA Y ALGORITMO VIOLA-JONES...</span>
        </div>

        <!-- Fallback captcha si la cámara falla -->
        <div id="captcha-fallback-container"
             style="display:none; width:100%; max-width:450px; flex-direction:column; align-items:center; margin-bottom:20px;">
            <div class="terminal-bg p-6 relative overflow-hidden flex flex-col items-center justify-center font-terminal w-full"
                 style="border: 2px solid #00ff00;">
                <h2 class="text-xl mb-6 text-center text-red-500 font-bold"
                    style="animation: blink 1s infinite;">FALLO ÓPTICO. VERIFICACIÓN MANUAL:</h2>
                <p class="text-white bg-[#004400] px-2 py-1 mb-4 border border-[#00ff00]">Un agente, un número más</p>
                <input type="text" id="captcha-input"
                       placeholder="ESCRIBA LA FRASE SUPERIOR"
                       class="w-full bg-black border-2 border-[#00ff00] p-2 text-[#00ff00] uppercase text-center focus:outline-none"
                       autocomplete="off" oninput="verifyCaptcha()">
            </div>
        </div>

        <button id="start-scan-btn" class="login-btn" onclick="startScan()" disabled>
            CÁMARA INACTIVA / BUSCANDO ROSTRO
        </button>
    </div>

    <!-- PANTALLA DE TRANSICIÓN -->
    <div id="transition-screen">
        <div class="noise-overlay"></div>
        <div class="scanlines-overlay"></div>
        <div style="z-index:60; display:flex; flex-direction:column; align-items:center;">
            <div style="animation: textGlitch 2s infinite; font-size:32px; font-weight:bold;">ACCESO CONCEDIDO</div>
            <br>
            <div>AGENTE <span id="agent-number-display">0000</span></div>
            <div class="loading-bar-container">
                <div class="loading-bar-fill" id="transition-loading-bar"></div>
            </div>
            <div style="animation: blink 1s infinite; font-size:14px; font-weight:normal;">
                [ DESENCRIPTANDO BASE DE DATOS D.B.A... ]
            </div>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script>
        // Si ya estaba autenticado, saltar directo al inicio
        if (sessionStorage.getItem('dba_authenticated') === 'true') {
            window.location.href = 'pages/inicio.html';
        }

        let camStream = null;
        let faceTracker = null;
        let isFaceDetected = false;
        let isCaptchaSolved = false;
        let scanBlocked = false;

        window.onload = async function () {
            try {
                camStream = await navigator.mediaDevices.getUserMedia({ video: true });
                const videoFeed = document.getElementById('cam-feed');
                videoFeed.srcObject = camStream;
                videoFeed.onloadedmetadata = function () {
                    addTerminalLine("> SEÑAL DE VIDEO RECIBIDA. ÓPTICA EN LÍNEA.");
                    addTerminalLine("> INICIANDO ALGORITMO DE RECONOCIMIENTO...");
                    faceTracker = new tracking.ObjectTracker('face');
                    faceTracker.setInitialScale(4);
                    faceTracker.setStepSize(2);
                    faceTracker.setEdgesDensity(0.1);
                    tracking.track('#cam-feed', faceTracker);
                    faceTracker.on('track', function (event) {
                        if (scanBlocked) return;
                        if (event.data.length === 0) {
                            if (isFaceDetected) {
                                addTerminalLine("> ADVERTENCIA: SUJETO PERDIDO.");
                                document.getElementById('start-scan-btn').disabled = true;
                                document.getElementById('start-scan-btn').innerHTML = "SITÚESE FRENTE A LA CÁMARA...";
                            }
                            isFaceDetected = false;
                            document.getElementById('face-box').style.display = 'none';
                        } else {
                            if (!isFaceDetected) {
                                addTerminalLine("> ROSTRO HUMANO DETECTADO.");
                                document.getElementById('start-scan-btn').disabled = false;
                                document.getElementById('start-scan-btn').innerHTML = "INICIAR ESCANEO BIOMÉTRICO";
                            }
                            isFaceDetected = true;
                            const rect = event.data[0];
                            const box = document.getElementById('face-box');
                            box.style.display = 'block';
                            box.style.left   = (320 - rect.x - rect.width) + 'px';
                            box.style.top    = rect.y + 'px';
                            box.style.width  = rect.width + 'px';
                            box.style.height = rect.height + 'px';
                        }
                    });
                };
            } catch (err) {
                scanBlocked = true;
                addTerminalLine("> ERROR: CÁMARA NO ENCONTRADA. ACTIVANDO PROTOCOLO MANUAL.");
                document.getElementById('scanner-container').style.display = "none";
                document.getElementById('captcha-fallback-container').style.display = "flex";
                document.getElementById('start-scan-btn').style.display = "none";
            }
        };

        function addTerminalLine(text) {
            const term = document.getElementById('terminal-output');
            const span = document.createElement('span');
            span.innerHTML = "<br>" + text;
            term.appendChild(span);
            term.scrollTop = term.scrollHeight;
        }

        function verifyCaptcha() {
            const input = document.getElementById('captcha-input').value.trim().toLowerCase();
            if (input === "un agente, un número más") {
                isCaptchaSolved = true;
                const inp = document.getElementById('captcha-input');
                inp.disabled = true;
                inp.style.borderColor = "#00ff00";
                inp.style.color = "#00ff00";
                addTerminalLine("> FRASE DE VERIFICACIÓN ACEPTADA.");
                startScan();
            }
        }

        function startScan() {
            if (!isFaceDetected && !isCaptchaSolved) return;
            scanBlocked = true;
            const btn = document.getElementById('start-scan-btn');
            if (btn) btn.disabled = true;
            document.getElementById('scan-line').style.display = 'block';

            let steps = [];
            if (isFaceDetected) {
                document.getElementById('flash-effect').classList.add('trigger-flash');
                const videoEl = document.getElementById('cam-feed');
                videoEl.pause();
                document.getElementById('face-box').style.borderColor = "#00ff00";
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = videoEl.videoWidth || 320;
                    canvas.height = videoEl.videoHeight || 240;
                    const ctx = canvas.getContext('2d');
                    ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
                    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                    sessionStorage.setItem('dba_user_photo', canvas.toDataURL('image/jpeg', 0.8));
                } catch (e) { }
                steps = ["> ANALIZANDO PATRONES GEOMÉTRICOS...", "> DESENCRIPTANDO CREDENCIALES NIVEL 4...", "> COINCIDENCIA CONFIRMADA."];
            } else {
                steps = ["> VERIFICANDO HUELLA LINGÜÍSTICA...", "> DESENCRIPTANDO CREDENCIALES NIVEL 4...", "> ACCESO CONCEDIDO."];
            }

            steps.forEach((step, index) => {
                setTimeout(() => addTerminalLine(step), 800 * (index + 1));
            });

            setTimeout(() => {
                if (camStream) camStream.getTracks().forEach(t => t.stop());
                const agentNum = Math.floor(Math.random() * 9000) + 1000;
                document.getElementById('agent-number-display').innerText = agentNum;
                sessionStorage.setItem('dba_agent_number', agentNum);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('transition-screen').style.display = 'flex';
                document.getElementById('transition-loading-bar').classList.add('fill-animation');
                setTimeout(() => {
                    sessionStorage.setItem('dba_authenticated', 'true');
                    window.location.href = 'pages/inicio.html';
                }, 3200);
            }, 800 * (steps.length + 1));
        }
    </script>
</body>
</html>
