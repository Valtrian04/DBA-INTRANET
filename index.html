<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="GENERATOR" content="Microsoft FrontPage 4.0">
    <meta name="ProgId" content="FrontPage.Editor.Document">
    <title>D.B.A - Departamento de Búsqueda de Andantes - Intranet</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .font-sys { font-family: "Courier New", Courier, monospace; }
        .font-ui { font-family: Tahoma, "MS Sans Serif", Arial, sans-serif; }
        .font-serif-title { font-family: "Times New Roman", Times, serif; }
        .font-terminal { font-family: "Lucida Console", Monaco, monospace; }

        .win-outset {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
        }
        .win-inset {
            background-color: #c0c0c0;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
        }
        .win-inset-deep {
            background-color: #ffffff;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #dfdfdf;
            border-bottom: 2px solid #dfdfdf;
        }
        .win-button {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            cursor: pointer;
            color: black;
            text-decoration: none;
            outline: none;
        }
        .win-button:active, .win-button.active {
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding-top: 2px;
            padding-left: 2px;
            background-color: #d4d0c8;
        }

        /* Messenger MSN */
        .msn-window {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            z-index: 50;
            display: none;
        }

        .bg-dba-blue { background-color: #000080; }
        .text-dba-blue { color: #000080; }
        .bg-dba-beige { background-color: #eaddcd; }
        
        body { background-color: #008080; } 
        
        .static-bg {
            background-image: repeating-radial-gradient(circle at 17% 32%, #111, #222 1px, #000 1px, #1a1a1a 2px);
            background-size: 4px 4px;
        }

        .terminal-bg {
            background-color: #0a110a;
            color: #00ff00;
            border: 1px solid #004400;
        }

        .doc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            font-family: "Courier New", Courier, monospace;
        }
        .doc-table th {
            background: #c0c0c0;
            border: 1px solid #808080;
            text-align: left;
            padding: 4px;
        }
        .doc-table td {
            border: 1px solid #dfdfdf;
            padding: 4px;
        }
        
        /* Estilo para el visor de pantalla completa */
        .full-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
            background: #808080;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center text-black font-ui min-h-screen relative">

    <div id="main-container" class="w-full max-w-[900px] bg-[#c0c0c0] win-outset p-1 shadow-[4px_4px_0px_rgba(0,0,0,0.5)] h-fit relative">
        
        <!-- HEADER -->
        <header class="bg-dba-blue text-white p-2 flex items-center mb-1 win-inset">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center border-2 border-[#c0c0c0] overflow-hidden ml-2 shrink-0">
                <div class="w-[90%] h-[90%] rounded-full border border-black flex items-center justify-center text-center">
                    <span class="text-dba-blue font-serif-title font-bold text-[10px] leading-tight" style="transform: rotate(-15deg);">
                        REPÚBLICA<br>DE<br>COLOMBIA
                    </span>
                </div>
            </div>
            <h1 class="font-serif-title text-4xl md:text-5xl font-bold tracking-[0.2em] ml-6" style="text-shadow: 2px 2px 0px black;">D.B.A</h1>
        </header>

        <!-- NAVEGACIÓN -->
        <nav id="main-nav" class="flex w-full mb-1">
            <button onclick="showPage('inicio')" id="btn-inicio" class="win-button active flex-1 py-1 px-2 text-center text-dba-blue font-sys font-bold text-sm">Inicio</button>
            <button onclick="showPage('nosotros')" id="btn-nosotros" class="win-button flex-1 py-1 px-2 text-center text-dba-blue font-sys font-bold text-sm">Nosotros</button>
            <button onclick="showPage('documentos')" id="btn-documentos" class="win-button flex-1 py-1 px-2 text-center text-dba-blue font-sys font-bold text-sm">Documentos</button>
            <button onclick="showPage('contacto')" id="btn-contacto" class="win-button flex-1 py-1 px-2 text-center text-dba-blue font-sys font-bold text-sm">Contacto</button>
            <button onclick="showPage('prueba')" id="btn-prueba" class="win-button flex-1 py-1 px-2 text-center text-dba-blue font-sys font-bold text-sm">Prueba Psicotécnica</button>
            <button onclick="showPage('faq')" id="btn-faq" class="win-button flex-1 py-1 px-2 text-center text-dba-blue font-sys font-bold text-sm">F.A.Q</button>
        </nav>

        <div id="marquee-container" class="win-inset bg-[#a0a0a0] py-1 px-2 mb-3">
            <marquee id="system-marquee" scrollamount="4" class="font-sys text-sm tracking-wider uppercase font-bold text-[#333]">
                PÁGINA EN DESUSO, ACCESO PERSONAL AUTORIZADO — REGISTRO DE ACTIVIDAD MONITORIZADO
            </marquee>
        </div>

        <!-- CONTENEDOR DINÁMICO -->
        <div id="content-area"></div>

        <footer id="main-footer" class="mt-2 win-inset bg-[#c0c0c0] p-2 flex justify-between items-center text-[10px] font-sys">
            <div>ESTADO: <span id="auth-status">AUTENTICADO</span></div>
            <div class="bg-black text-red-500 font-bold px-2 tracking-widest">004,815</div>
            <div>D.B.A. INTRANET v2.04</div>
        </footer>
    </div>

    <!-- TEMPLATES DE PÁGINAS -->
    <template id="tpl-inicio">
        <div class="flex flex-col md:flex-row gap-2 h-full">
            <main class="w-full md:w-[65%] bg-dba-beige win-inset-deep p-4 md:p-6 flex flex-col">
                <div class="win-outset bg-[#c0c0c0] p-1 mb-6 w-full max-w-[480px] mx-auto">
                    <div class="w-full aspect-[4/3] bg-black win-inset relative border-4 border-[#333] overflow-hidden">
                        <video id="dba-feed" class="w-full h-full object-cover" autoplay muted loop playsinline poster="https://api.placeholder.com/480/360/000000/00ff00?text=CONECTANDO+FEED...">
                            <source src="videos/Intro.mp4">
                        </video>
                        <div class="absolute inset-0 pointer-events-none static-bg opacity-25"></div>
                        <div class="absolute top-2 left-2 text-[#00ff00] font-terminal text-[10px] opacity-70 tracking-tighter">
                            REC <span id="live-clock">00:00:00</span>
                        </div>
                    </div>
                </div>
                <div class="font-sys text-[13px] leading-relaxed text-black text-justify space-y-4">
                    <p>En la Dirección de Búsqueda de Andantes (DBA), nos dedicamos a proteger a Colombia de una amenaza que acecha en las sombras...</p>
                    <p class="font-bold border-l-4 border-dba-blue pl-4 italic">"Luchando en las Sombras por la Seguridad de Colombia"</p>
                </div>
            </main>
            <aside class="w-full md:w-[35%] bg-dba-beige win-inset-deep p-4 flex flex-col">
                <h2 class="font-sys font-bold text-sm mb-4 border-b border-black pb-1 uppercase">Ultimas Noticias</h2>
                
                <!-- NOTICIA QUE ABRE EL VISOR INTERNO -->
                <div class="mb-6 text-center">
                    <button onclick="showPage('visor-pdf')" class="block w-full group outline-none">
                        <div class="win-inset bg-gray-600 w-full aspect-video flex items-center justify-center overflow-hidden border border-gray-400 group-hover:brightness-110 transition-all">
                            <!-- ESPACIO PARA TU IMAGEN DE PORTADA -->
                            <img src="img/CeseDBA.png" 
                                 alt="Reporte Clasificado" 
                                 class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all">
                        </div>
                    </button>
                    <h3 class="text-dba-blue font-sys font-bold text-[12px] mt-2">Mayo 26 2002</h3>
                    <p class="font-sys text-[10px] leading-tight text-left">Posesión presidencial bajo protocolos de contingencia Nivel 4.</p>
                </div>

                <!-- NOTICIA ARCHIVO 1985 (NO CLICKEABLE) -->
                <div class="mb-6 text-center opacity-80">
                    <div class="win-inset bg-gray-700 w-full aspect-video flex items-center justify-center overflow-hidden border border-gray-500">
                        <!-- ESPACIO PARA TU IMAGEN DEL PALACIO DE JUSTICIA -->
                        <img src="img/PalacioJusticia.jpg" 
                             alt="Archivo Palacio de Justicia" 
                             class="w-full h-full object-cover grayscale">
                    </div>
                    <h3 class="text-gray-800 font-sys font-bold text-[12px] mt-2">Noviembre 6 1985</h3>
                    <p class="font-sys text-[10px] leading-tight text-left">Toma del Palacio de Justicia. Operación de contención y barrido de información.</p>
                    <p class="text-[9px] font-sys text-red-700 mt-1 text-left font-bold tracking-widest">[EXPEDIENTE CERRADO]</p>
                </div>

                <button onclick="toggleMessenger()" class="win-button w-full py-2 font-bold text-xs mt-auto flex items-center justify-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full border border-white"></span> Soporte MSN
                </button>
            </aside>
        </div>
    </template>

    <!-- VISOR DE DOCUMENTO (PANTALLA COMPLETA INTERNA) -->
    <template id="tpl-visor-pdf">
        <div class="full-viewer win-outset">
            <!-- Barra de Herramientas del Visor -->
            <div class="bg-[#c0c0c0] p-1 border-b border-gray-600 flex justify-between items-center">
                <div class="flex gap-1">
                    <button onclick="showPage('inicio')" class="win-button px-3 py-1 flex items-center gap-2 font-bold text-xs">
                        <span>←</span> ATRÁS
                    </button>
                    <div class="win-inset bg-[#dcdcdc] px-4 py-1 text-[10px] font-sys flex items-center">
                        Documento: REPORTE_CLA_026.IMG (Solo Lectura)
                    </div>
                </div>
                <div class="text-[10px] font-sys pr-2">Zoom: 100%</div>
            </div>
            
            <!-- Contenedor del Documento -->
            <div class="flex-grow overflow-auto p-4 bg-[#525659] flex justify-center">
                <div class="bg-white shadow-2xl min-w-[300px] max-w-[800px] h-fit">
                    <!-- AQUÍ SUBIRÁS TU IMAGEN DEL PDF/DOCUMENTO -->
                    <img src="img/Comunicado Del Presidente DBA PNG.jpeg" 
                         alt="Documento Clasificado" 
                         class="w-full h-auto">
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-nosotros">
        <div class="bg-dba-beige win-inset-deep p-6 md:p-10 h-full min-h-[450px]">
            <h2 class="font-sys font-bold text-3xl mb-8 tracking-tight">¿Quienes son nuestros agentes?</h2>
            <div class="font-sys text-[14px] leading-relaxed text-black space-y-6">
                <p>La Dirección de Búsqueda de Andantes (DBA) fue establecida en 1928...</p>
            </div>
        </div>
    </template>

    <template id="tpl-documentos">
        <div class="bg-dba-beige win-inset-deep p-4 min-h-[400px]">
            <h2 class="font-sys font-bold text-lg text-dba-blue mb-4">/ARCHIVOS/CLASIFICADOS/</h2>
            <table class="doc-table">
                <thead><tr><th>Tipo</th><th>Nombre</th><th>Nivel</th></tr></thead>
                <tbody>
                    <tr><td>[TXT]</td><td><a href="#" class="text-blue-800 underline">Protocolo_01.txt</a></td><td>LVL_5</td></tr>
                </tbody>
            </table>
        </div>
    </template>

    <template id="tpl-contacto">
        <div class="bg-dba-beige win-inset-deep p-6 md:p-12 h-full min-h-[450px]">
            <h2 class="font-sys font-bold text-3xl mb-8 tracking-tight">¿Ha visto algo extraño?</h2>
            <p class="font-sys text-blue-800 font-bold text-3xl">+57 315 7531693</p>
        </div>
    </template>

    <template id="tpl-faq">
        <div class="bg-dba-beige win-inset-deep p-6 md:p-10 h-full min-h-[450px] overflow-y-auto">
            <h2 class="font-bold text-2xl mb-4 text-dba-blue uppercase text-center border-b border-gray-400 pb-2">F.A.Q.</h2>
            <p class="font-sys">Preguntas frecuentes sobre los andantes.</p>
        </div>
    </template>

    <template id="tpl-captcha">
        <div class="terminal-bg p-6 md:p-12 h-full min-h-[450px] relative overflow-hidden flex flex-col items-center justify-center font-terminal">
            <h2 class="text-xl mb-6">ESCRIBA FRASE DE VERIFICACIÓN:</h2>
            <p class="text-white bg-[#004400] px-2 py-1 mb-4 border border-[#00ff00]">Un agente, un número más</p>
            <input type="text" id="captcha-input" class="w-full bg-black border-2 border-[#00ff00] p-2 text-[#00ff00] uppercase text-center focus:outline-none">
            <button onclick="verifyCaptcha()" class="mt-4 border-2 border-[#00ff00] px-6 py-2 hover:bg-[#00ff00] hover:text-black font-bold">VERIFICAR</button>
        </div>
    </template>

    <template id="tpl-prueba">
        <div class="bg-dba-beige win-inset-deep p-6 h-full min-h-[400px]">
            <h2 class="font-sys font-bold text-xl text-dba-blue mb-4">PRUEBA PSICOTÉCNICA</h2>
            <button onclick="processTest()" class="win-button px-8 py-2">FINALIZAR</button>
        </div>
    </template>

    <!-- MSN MESSENGER -->
    <div id="msn-window" class="msn-window win-outset shadow-2xl">
        <div class="msn-header">
            <span>Gemi (Soporte)</span>
            <button onclick="toggleMessenger()" class="bg-[#e0e0e0] text-black px-1 border border-black text-[10px]">X</button>
        </div>
        <div class="p-2 bg-[#f0f0f0]">
            <div id="chat-box" class="win-inset-deep bg-white h-48 p-2 mb-2 text-[11px] overflow-y-auto">Gemi dice: Hola operativo.</div>
            <input type="text" id="chat-input" class="win-inset-deep w-full p-1 text-[11px]" onkeypress="if(event.key==='Enter') sendMessage()">
        </div>
    </div>

    <script>
        let isVerified = false;

        function updateClock() {
            const clock = document.getElementById('live-clock');
            if (clock) {
                const now = new Date();
                clock.innerText = now.toLocaleTimeString('es-CO');
            }
        }
        setInterval(updateClock, 1000);

        function showPage(pageId) {
            const container = document.getElementById('content-area');
            const mainContainer = document.getElementById('main-container');
            const nav = document.getElementById('main-nav');
            const marquee = document.getElementById('marquee-container');
            const footer = document.getElementById('main-footer');

            if (pageId === 'prueba' && !isVerified) pageId = 'captcha';

            // Lógica para "Pantalla Completa" del visor
            if (pageId === 'visor-pdf') {
                mainContainer.classList.remove('h-fit');
                mainContainer.classList.add('h-full', 'max-w-none', 'p-0', 'm-0');
                nav.classList.add('hidden');
                marquee.classList.add('hidden');
                footer.classList.add('hidden');
                document.body.classList.remove('p-4', 'md:p-8');
            } else {
                mainContainer.classList.add('h-fit');
                mainContainer.classList.remove('h-full', 'max-w-none', 'p-0', 'm-0');
                nav.classList.remove('hidden');
                marquee.classList.remove('hidden');
                footer.classList.remove('hidden');
                document.body.classList.add('p-4', 'md:p-8');
            }

            const template = document.getElementById('tpl-' + pageId);
            
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById('btn-' + (pageId === 'captcha' ? 'prueba' : pageId));
            if(activeBtn) activeBtn.classList.add('active');

            if (template) {
                container.innerHTML = template.innerHTML;
                updateClock();
            }
        }

        function verifyCaptcha() {
            const val = document.getElementById('captcha-input').value.trim().toLowerCase();
            if (val === "un agente, un número más") {
                isVerified = true;
                showPage('prueba');
            } else {
                alert("CREDENCIALES INVÁLIDAS.");
            }
        }

        function processTest() {
            alert("PROCESANDO...");
            setTimeout(() => {
                document.getElementById('auth-status').innerText = "VIGILANCIA ACTIVA";
                showPage('inicio');
            }, 1000);
        }

        function toggleMessenger() {
            const win = document.getElementById('msn-window');
            win.style.display = (win.style.display === 'block') ? 'none' : 'block';
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const chatBox = document.getElementById('chat-box');
            if(input.value) {
                chatBox.innerHTML += `<div><b>Operativo:</b> ${input.value}</div>`;
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        window.onload = () => showPage('inicio');
    </script>
</body>
</html>
