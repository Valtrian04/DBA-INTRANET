<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.B.A - Departamento de Búsqueda de Andantes - Intranet</title>
   
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/face-min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ESTILOS PREVIOS MANTENIDOS */
        .font-sys { font-family: "Courier New", Courier, monospace; }
        .font-ui { font-family: Tahoma, "MS Sans Serif", Arial, sans-serif; }
        .font-serif-title { font-family: "Times New Roman", Times, serif; }
        .win-outset { background-color: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #808080; border-bottom: 2px solid #808080; }
        .win-inset { background-color: #c0c0c0; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; }
        .win-inset-deep { background-color: #ffffff; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #dfdfdf; border-bottom: 2px solid #dfdfdf; }
        .win-button { background-color: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #404040; border-bottom: 2px solid #404040; cursor: pointer; color: black; outline: none; }
        .win-button:active, .win-button.active { border-top: 2px solid #404040; border-left: 2px solid #404040; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; background-color: #d4d0c8; }
        
        body { background-color: #008080; }
        .noise-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; opacity: 0.15; background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E'); }
        .scanlines-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.3)); background-size: 100% 4px; pointer-events: none; z-index: 51; }
        
        /* PANTALLAS Y COMPONENTES */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #051005; color: #00ff00; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: "Courier New", monospace; }
        #app-content { display:none; }
        .page-tab { min-height: 450px; }
        .hidden { display: none; }
        
        /* UI RADIO */
        #radio-container { width: 100%; max-width: 600px; margin: 0 auto; background-color: #1a1a1a; border: 5px ridge #444; padding: 30px; }
        .radio-display { background-color: #051005; border: 4px inset #003300; height: 90px; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; color: #004400; font-size: 48px; font-family: 'Courier New', Courier, monospace; }
        .radio-knob { width: 110px; height: 110px; border-radius: 50%; background: #d4d0c8; border: 4px outset #fff; cursor: grab; transform: rotate(-135deg); }
        .radio-knob.disabled { pointer-events: none; filter: brightness(0.6); }
        
        /* ESTILOS DE ERROR/GLITCH */
        .fatal-error { animation: shake 0.4s infinite; color: #ff0000 !important; }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 20% { transform: translate(-2px, 1px); } 80% { transform: translate(2px, -2px); } }
    </style>
</head>
<body class="p-8 flex justify-center text-black font-ui min-h-screen relative">

    <!-- LOGIN SCREEN (Simplificado para brevedad) -->
    <div id="login-screen">
        <h1 class="text-2xl font-bold mb-4">D.B.A. TERMINAL DE ACCESO</h1>
        <button class="win-button p-4" onclick="grantAccess()">ENTRAR AL SISTEMA</button>
    </div>

    <!-- MAIN APP -->
    <div id="app-content" class="w-full max-w-[900px]">
        <div id="main-container" class="bg-[#c0c0c0] win-outset p-1">
            <nav id="main-nav" class="flex flex-wrap gap-1 mb-2">
                <button onclick="showPage('inicio')" class="win-button px-4">Inicio</button>
                <button onclick="showPage('radio')" class="win-button px-4">Radio</button>
            </nav>

            <div id="content-area">
                <!-- TAB RADIO -->
                <div id="tab-radio" class="page-tab hidden bg-[#eaddcd] win-inset-deep p-6">
                    <h2 class="text-2xl font-bold mb-4 text-navy-900">Interceptor de Frecuencias</h2>
                    <div id="radio-container">
                        <div class="radio-display"><span id="freq-display">---.- AM</span></div>
                        <div class="flex justify-center"><div class="radio-knob" id="radio-knob"></div></div>
                        <button id="radio-power-btn" class="w-full mt-6 win-button p-4" onclick="toggleRadio()">ENCENDER RADIO</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- OVERLAY DE RADIO SUTATENZA (ANOMALÍA 104.1) -->
    <div id="radio-video-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index: 20000; justify-content:center; align-items:center; flex-direction:column;">
        <video id="radio-sutatenza-feed" class="w-full max-w-[800px] aspect-video border-4 border-[#00ff00]" playsinline>
            <source src="videos/RadioSutatenza.mp4" type="video/mp4">
        </video>
        <button id="play-radio-video-btn" onclick="playRadioVideo()" class="mt-4 win-button p-4 font-bold text-xl shadow-[4px_4px_0px_#00ff00]">▶ INICIAR TRANSMISIÓN HISTÓRICA</button>
        <button onclick="closeRadioVideo()" class="mt-4 text-white font-sys underline text-xs">CERRAR TRANSMISIÓN</button>
    </div>

    <script>
        // --- VARIABLES GLOBALES ---
        let audioCtx, noiseGain, isRadioOn = false;
        let screamTriggered = false; // 94.1
        let externalScreamTriggered = false; // 99.9
        let externalScreamAudio = new Audio('Audios/Grito.mp3');
        
        function grantAccess() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        }

        function showPage(id) {
            document.querySelectorAll('.page-tab').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
        }

        function toggleRadio() {
            isRadioOn = !isRadioOn;
            const btn = document.getElementById('radio-power-btn');
            btn.innerText = isRadioOn ? "APAGAR RADIO" : "ENCENDER RADIO";
            if(isRadioOn && !audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(!isRadioOn) { externalScreamAudio.pause(); externalScreamAudio.currentTime = 0; }
        }

        // LÓGICA DE SINTONIZACIÓN
        function tuneRadio(freq) {
            if (!isRadioOn) return;
            document.getElementById('freq-display').innerText = freq.toFixed(1) + " AM";

            // ANOMALÍA 1: 94.1 (Audio Sintético)
            if (Math.abs(freq - 94.1) < 0.1 && !screamTriggered) triggerScream();
            
            // ANOMALÍA 2: 99.9 (Archivo Audios/Grito.mp3)
            if (Math.abs(freq - 99.9) < 0.1 && !externalScreamTriggered) triggerExternalScream();
            
            // ANOMALÍA 3: 104.1 (Video RadioSutatenza.mp4)
            if (Math.abs(freq - 104.1) < 0.1) {
                document.getElementById('radio-video-overlay').style.display = 'flex';
            }
        }

        function triggerScream() { 
            screamTriggered = true; 
            // Lógica de oscilador previo...
        }

        function triggerExternalScream() {
            externalScreamTriggered = true;
            externalScreamAudio.play();
        }

        // CONTROL DE VIDEO RADIO SUTATENZA
        function playRadioVideo() {
            const video = document.getElementById('radio-sutatenza-feed');
            video.play();
            document.getElementById('play-radio-video-btn').style.display = 'none';
        }

        function closeRadioVideo() {
            const video = document.getElementById('radio-sutatenza-feed');
            video.pause(); video.currentTime = 0;
            document.getElementById('radio-video-overlay').style.display = 'none';
            document.getElementById('play-radio-video-btn').style.display = 'flex';
        }

        // Listener de la perilla (ejemplo simplificado)
        document.getElementById('radio-knob').addEventListener('mousedown', () => {
            // Aquí iría tu lógica de cálculo de grados a frecuencia
            tuneRadio(94.1); // Probar ANOMALÍA 1
            tuneRadio(99.9); // Probar ANOMALÍA 2
            tuneRadio(104.1); // Probar ANOMALÍA 3
        });
    </script>
</body>
</html>
